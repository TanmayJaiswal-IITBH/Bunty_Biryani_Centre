services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bbc
      POSTGRES_PASSWORD: bbc
      POSTGRES_DB: bbc_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bbc -d bbc_dev']
      interval: 5s
      retries: 10
volumes:
  pgdata: {}
